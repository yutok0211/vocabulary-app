name: Android APK

on:
  push:
    paths:
      - "restaurant-search/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: restaurant-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "PLACES_API_KEY=${{ secrets.PLACES_API_KEY }}" > local.properties

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mapmeshi-debug-apk
          path: restaurant-search/app/build/outputs/apk/debug/*.apk
          retention-days: 30
